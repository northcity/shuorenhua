name: Sync GPT Site
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current published site
        env:
          SOURCE: https://shuorenhua-beicheng.beicbeichbeichengbeicheng.chatgpt.site
        run: |
          set -euo pipefail
          curl -fsSL "$SOURCE/" -o index.html
          python3 - <<'PY'
          import re, subprocess, os
          from pathlib import Path
          html=Path("index.html").read_text()
          urls=sorted(set(re.findall(r'(?:href|src)="(/(?:_next/[^"? ]+|logo-mark\.svg|favicon\.svg))', html)))
          for u in urls:
              p=Path(u.lstrip("/"))
              p.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["curl","-fsSL",os.environ["SOURCE"]+u,"-o",str(p)],check=True)
          PY
          printf '%s\n' 'shuorenhua.online' > CNAME
          touch .nojekyll
      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CNAME .nojekyll _next logo-mark.svg favicon.svg
          git diff --cached --quiet || git commit -m "Sync published GPT Site"
          git push
