name: Sync GPT Site
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current published site
        env:
          SOURCE: https://shuorenhua-beicheng.beicbeichbeichengbeicheng.chatgpt.site
        run: |
          set -euo pipefail
          curl -fsSL -H "Accept: text/html" "$SOURCE/?sync=1" -o index.html
          python3 - <<'PY'
          import re, subprocess, os
          from pathlib import Path
          html=Path("index.html").read_text()
          urls=sorted(set(re.findall(r'(?:href|src)="(/(?:_next/[^"? ]+|logo-mark\.svg|favicon\.svg))', html)))
          for u in urls:
              p=Path(u.lstrip("/"))
              p.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["curl","-fsSL",os.environ["SOURCE"]+u,"-o",str(p)],check=True)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          logo='<svg aria-hidden="true" viewBox="0 0 64 64" style="width:32px;height:32px;display:block"><path fill="#242528" fill-rule="evenodd" d="M32 3a29 29 0 1 0 29 29A29 29 0 0 0 32 3Zm0 12a17 17 0 1 1-17 17 17 17 0 0 1 17-17Z"/><path fill="#737477" d="M32 3a29 29 0 0 1 27.3 19.2l-11.4 3.9A17 17 0 0 0 32 15Z"/><path fill="#b2b2b3" d="m32 3 9 13.6-9-1.6Z"/></svg>'
          import re
          s,n=re.subn(r'<span class="brand-mark"><img[^>]*></span>|<img src="/(?:logo-mark\.svg|brand-mark\.png)"[^>]*>|<svg aria-hidden="true" viewBox="0 0 64 64".*?</svg>',logo,s,count=1)
          if not n:
              raise SystemExit("Could not find header logo slot")
          p.write_text(s)
          PY
          printf '%s\n' 'shuorenhua.online' > CNAME
          touch .nojekyll
      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CNAME .nojekyll _next logo-mark.svg brand-mark.png favicon.svg
          git diff --cached --quiet || git commit -m "Sync published GPT Site"
          git push
