name: Sync GPT Site
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current published site
        env:
          SOURCE: https://shuorenhua-beicheng.beicbeichbeichengbeicheng.chatgpt.site
        run: |
          set -euo pipefail
          curl -fsSL -H "Accept: text/html" "$SOURCE/?sync=1" -o index.html
          python3 - <<'PY'
          import re, subprocess, os
          from pathlib import Path
          html=Path("index.html").read_text()
          urls=sorted(set(re.findall(r'(?:href|src)="(/(?:_next/[^"? ]+|logo-mark\.svg|favicon\.svg))', html)))
          for u in urls:
              p=Path(u.lstrip("/"))
              p.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["curl","-fsSL",os.environ["SOURCE"]+u,"-o",str(p)],check=True)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          import re
          s=re.sub(r'<span class="brand-mark"><img[^>]*></span>|<img src="/(?:logo-mark\.svg|brand-mark\.png)"[^>]*>|<svg aria-hidden="true" viewBox="0 0 64 64".*?</svg>', '', s, count=1)
          style='<style id="pages-brand-mark">.brand::before{content:"";display:block;box-sizing:border-box;width:32px;height:32px;flex:0 0 32px;border:6px solid #242528;border-right-color:#737477;border-bottom-color:#b2b2b3;border-radius:50%}.brand .brand-mark,.brand>img,.brand>svg{display:none!important}@media(max-width:600px){.brand::before{width:29px;height:29px;flex-basis:29px}}</style>'
          if 'id="pages-brand-mark"' not in s:
              s=s.replace("</head>",style+"</head>",1)
          p.write_text(s)
          PY
          printf '%s\n' 'shuorenhua.online' > CNAME
          touch .nojekyll
      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync published GPT Site"
          git push
